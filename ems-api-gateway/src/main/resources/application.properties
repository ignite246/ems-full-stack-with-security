# ============================================================
# Server Configuration
# ============================================================

server.port=8082
spring.application.name=ems-api-gateway


# ============================================================
# Gateway Routes
# ============================================================

# ------------------------------------------------------------
# Auth Service
# ------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[0].id=ems-auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/ems-dev/v1/api/auth/**


# ------------------------------------------------------------
# Employee APIs
# ------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[1].id=ems-employee-route
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/ems-dev/v1/api/employees/**


# ------------------------------------------------------------
# Department APIs
# ------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[2].id=ems-department-route
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/ems-dev/v1/api/departments/**


# ------------------------------------------------------------
# Office APIs
# ------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[3].id=ems-office-route
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ems-dev/v1/api/offices/**

# ------------------------------------------------------------
# EMS Backend Actuator
# -----------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[4].id=ems-actuator-route
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/ems-dev/v1/actuator/**


# ============================================================
# CORS Configuration
# ============================================================
#
# CORS is configured at the API Gateway because the Gateway is
# the browser-facing entry point for the application.
#
# Backend services should not add their own controller-level
# CORS configuration (@CrossOrigin), otherwise both Gateway
# and backend may return Access-Control-Allow-Origin headers,
# causing duplicate CORS headers and browser rejection.
#

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept