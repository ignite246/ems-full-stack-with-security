# Server configuration
server.port=8082

# Application name
spring.application.name=ems-api-gateway


# EMS Backend route
spring.cloud.gateway.server.webflux.routes[0].id=ems-backend-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/ems-dev/v1/**


# CORS configuration
# CORS is configured at the API Gateway because the Gateway is the
# browser-facing entry point for the application.
#
# The backend services should not add their own controller-level CORS
# configuration (@CrossOrigin), otherwise both Gateway and backend may
# return Access-Control-Allow-Origin headers, causing duplicate CORS
# headers and browser rejection.

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept